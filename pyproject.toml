[project]
name = "eoread"
authors = [{name = "HYGEOS team"}]
description = "Modular implementation of satellite data input/output relying on xarray."
license = "Apache 2.0"
version = "0.4.1"
requires-python = ">= 3.11"
readme = "README.md"
dependencies = [
    "lxml",
    "pyproj",
    "pysolar",
    "pyepr",
    "rioxarray",
    "cdsapi",
    "shapely", 
    "h5netcdf", "h5py"
]

[project.optional-dependencies]
git = [
    "core @ git+https://github.com/hygeos/core.git",
    "sand @ git+https://github.com/hygeos/sand.git"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
eoread = { path = ".", editable = true, extras = ["git"]}
eotools = { git = "git+https://github.com/hygeos/eotools.git" }

[tool.pixi.tasks]
tests = "pytest tests/"
reader = "python3 scripts/eval_readers.py"
clean_sample = "echo SAMPLE_DATA/*"

[tool.pixi.dependencies]
pytest = "*"
pytest-html = "*"
pytest-xdist = "*"
matplotlib-base = "*"
ipykernel = "*"
libgdal-jp2openjpeg = "*"  # Required to read compress jp2 file in MSI reader
cdsapi = "*"
eumdac = "*"
pyhdf = "*"
numba = "*"

[tool.pixi.environments]
default = { features = ["hyp", "sys"], solve-group = "default" }

[tool.pixi.feature.sys.dependencies]
libgdal-jp2openjpeg = "*"

[tool.pixi.feature.hyp.dependencies]
xarray = "*"
dask = "*"
scipy = "*"
numpy = "*"
