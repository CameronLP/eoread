[project]
name = "eoread"
authors = [{name = "HYGEOS team"}]
description = "Modular implementation of satellite data input/output relying on xarray."
license = "Apache 2.0"
version = "0.3-dev"
requires-python = ">= 3.11"
readme = "README.md"
dependencies = [
    "lxml",
    "pyproj",
    "rioxarray",
    "cdsapi",
    "pyepr",
    "eumdac",
    "pyhdf",
    "pysolar",
    "fs"]

[project.optional-dependencies]
git = [
    "core @ git+https://github.com/hygeos/core.git",
    "sand @ git+https://github.com/hygeos/sand.git"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
eoread = { path = ".", editable = true, extras = ["git"]}

[tool.pixi.tasks]
tests = "pytest tests/"

[tool.pixi.dependencies]
pytest = "*"
pytest-html = "*"
pytest-xdist = "*"
numpy = "<2"
lxml = "*"
xarray = "*"
pandas = "*"
dask = "*"
pyproj = "*"
rioxarray = "*"
matplotlib-base = "*"
cdsapi = "*"
pyepr = "*"
toml = "*"
python-dotenv = "*"
h5py = "*"
h5netcdf = "*"
eumdac = "*"
pyhdf = "*"
libgdal-jp2openjpeg = "*"
pysolar = "*"
fs = "*"
