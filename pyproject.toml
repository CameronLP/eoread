[project]
name = "eoread"
authors = [{name = "HYGEOS team"}]
description = "Modular implementation of satellite data input/output relying on xarray."
license = "Apache 2.0"
version = "0.3.1"
requires-python = ">= 3.11"
readme = "README.md"
dependencies = [
    "pyproj",
    "pyhdf",
    "pysolar",
    "pyepr",
    "rioxarray"
    ]

[project.optional-dependencies]
git = [
    "core @ git+https://github.com/hygeos/core.git",
    "sand @ git+https://github.com/hygeos/sand.git"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
eoread = { path = ".", editable = true, extras = ["git"]}

[tool.pixi.tasks]
tests = "pytest tests/"
reader = "python3 scripts/eval_readers.py"

[tool.pixi.dependencies]
pytest = "*"
pytest-html = "*"
pytest-xdist = "*"
# pandas = "*"
matplotlib-base = "*"
# toml = "*"
# h5py = "*"
# h5netcdf = "*"
ipykernel = "*"
# libgdal-jp2openjpeg = "*"

[tool.pixi.environments]
default = { features = ["hyp", "sys"], solve-group = "default" }

[tool.pixi.feature.sys.dependencies]
# libgdal-jp2openjpeg = "*"

[tool.pixi.feature.hyp.dependencies]
xarray = "*"
dask = "*"
scipy = "*"
numpy = "*"
